name: KHALID DEAL HUNTER

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/deals.db"
      - "data/dashboard.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khalid-deal-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Refresh main before scanning
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run scraper regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate website labels and JavaScript
        run: |
          node --check website/app.js
          node --test tests/test_frontend.cjs

      - name: Run KHALID DEAL HUNTER
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Checkpoint database
        if: always()
        run: python -c "from database import checkpoint; checkpoint()"

      - name: Export dashboard snapshot
        if: always()
        run: python dashboard.py

      - name: Preserve recovery copy and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-archive-${{ github.run_id }}
          path: |
            data/deals.db
            scan-results.json
            data/dashboard.json
          retention-days: 30

      - name: Save database changes
        if: always()
        run: |
          git config user.name "KHALID DEAL HUNTER"
          git config user.email "actions@github.com"
          git add data/deals.db data/dashboard.json
          git diff --cached --quiet || git commit -m "Update deal hunter price history"
          git push
